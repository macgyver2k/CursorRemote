services:
  # Cursor launch (PowerShell):
  # & "$env:LOCALAPPDATA\Programs\cursor\Cursor.exe" --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0
  backend:
    build: .
    ports:
      - "3333:3000"
    environment:
      CDP_URL: http://host.docker.internal:9222
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      DATA_DIR: /app/data
      SELECTORS_PATH: /app/selectors.json
    volumes:
      - backend-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backend-data:
